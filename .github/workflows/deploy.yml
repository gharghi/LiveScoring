name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (default origin/main)"
        required: false
        default: "origin/main"

# One production deploy at a time; queue rather than cancel, so a superseded
# run still finishes its migration instead of being killed part-way.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Engine self-checks
        run: python3 -m tests

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DISPATCH_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" || { echo "::error::DEPLOY_SSH_KEY is not set"; exit 1; }
          test -n "$DEPLOY_HOST" || { echo "::error::DEPLOY_HOST is not set"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "::error::DEPLOY_USER is not set"; exit 1; }

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${DISPATCH_REF:-}" ]; then
            REF="$DISPATCH_REF"
          else
            REF="origin/${GITHUB_REF_NAME}"
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          echo "Deploying $REF to $DEPLOY_USER@$DEPLOY_HOST"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
              -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              /srv/livescoring/deploy/deploy.sh "$REF"
